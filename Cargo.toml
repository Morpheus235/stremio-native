# StremioNative: a native Stremio client for rooted LG webOS TVs.
# The workspace holds the layer crates under `crates/`, the screens and the application crate
# (`crates/app`, the one staticlib the C boot shim links).
[workspace]
members = [
    "crates/base",
    "crates/machine",
    "crates/net",
    "crates/platform",
    "crates/gfx",
    "crates/media",
    "crates/ui",
    "crates/storage",
    "crates/stremio",
    "crates/screens",
    "crates/app",
]
resolver = "2"

[workspace.lints.rust]
warnings = "deny"

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1

# Fast local device builds: release codegen without LTO.
[profile.tvdev]
inherits = "release"
lto = "off"
codegen-units = 16
