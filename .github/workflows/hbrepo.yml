# Publishes the Homebrew Channel repository on GitHub Pages (and the download page, site/index.html,
# at the site's root), one URL with two entries:
#
#   https://<owner>.github.io/stremio-native/repo.json
#     StremioNative        the newest stable release
#     StremioNative Beta   the newest prerelease, a separate app (own id, tile and sign-in)
#                          that installs beside stable
#
# Each entry points the TV at its release's own ipk asset. An entry with no release yet is left
# out, so the URL can be added on the TV before the first build (it lists nothing until then).
# Pages replaces the whole site on every deploy, so every run regenerates both entries.
# One-time setup: Settings > Pages > Source: "GitHub Actions".
# The download page deploys on every push to main that changes it. The Homebrew Channel listing
# (repo.json) is on hold: only a manual run on main with "homebrew" ticked builds it
# (Actions > Homebrew Channel repository > Run workflow); without it the page links the releases.
name: Homebrew Channel repository

on:
  push:
    branches: [main]
    paths: [ci/hbrepo.py, .github/workflows/hbrepo.yml, site/**, docs/screenshots/**]
  workflow_dispatch:
    inputs:
      homebrew:
        description: Also publish the Homebrew Channel listing (repo.json)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate both channels
        if: inputs.homebrew
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I ci/hbrepo.py --selftest
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,isDraft,createdAt)
          mkdir -p _site && echo '{"packages": []}' > _site/repo.json
          channel() {  # channel <prerelease true|false> <title>
            local tag
            tag=$(echo "$releases" | jq -r --argjson pre "$1" \
              '[.[] | select(.isDraft == false and .isPrerelease == $pre)] | sort_by(.createdAt) | last | .tagName // ""')
            if [ -z "$tag" ]; then
              echo "$2: no release yet, not listed"
              return
            fi
            rm -rf dl && mkdir dl
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.ipk' --dir dl
            test "$(ls dl/*.ipk | wc -l)" = 1
            local ipk; ipk=$(ls dl/*.ipk)
            python3 -I ci/hbrepo.py --ipk "$ipk" --base-url "$base" --title "$2" \
              --ipk-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$ipk")" \
              --icon-url "$base/icon160.png" --out _site
            echo "$2: $tag"
          }
          channel false "StremioNative"
          channel true "StremioNative Beta"
          if [ -f pkg/icon160.png ]; then cp pkg/icon160.png _site/; fi
      - name: The download page
        run: |
          set -euo pipefail
          mkdir -p _site
          # the download page beside the index: it reads repo.json and the manifests in the browser
          cp site/index.html _site/
          mkdir -p _site/screenshots && cp docs/screenshots/*.jpg _site/screenshots/
          find _site -name '*.json' -print -exec cat {} \;
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
