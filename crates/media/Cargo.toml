[package]
name = "sn_media"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "StremioNative media layer: demux (the bundled FFmpeg), the HTTPS media pull source, the access-unit queues, subtitles and the buffer-feed player engine."
repository = "https://github.com/Morpheus235/stremio-native"
publish = false

[lib]
name = "sn_media"
# An rlib the application crate links, never an archive of its own. It owns no build script and
# links nothing -- the FFmpeg, libass and libcurl symbols are `dynlib!` tables (dlopen at run
# time), the Starfish/ACB externs of `player::ffi` are resolved by the final link, and the two
# `#[no_mangle]` callbacks `native/starfish.c` calls (`sf_on_event`, `acb_on_event`) ride the
# application's staticlib.
crate-type = ["rlib"]

[features]
default = []
# Forwarded from the application crate, which is the only one that sets them. `devtriggers` is
# behaviour here, not plumbing: the dev triggers read their files through `sn_base::devtrig`, which
# is compile-time `None` without it.
devtriggers = ["sn_base/devtriggers", "sn_machine/devtriggers", "sn_net/devtriggers", "sn_platform/devtriggers", "sn_gfx?/devtriggers"]
# `player::ffi_host` (the simulator's `VideoSink`) and `player::sim_video` replace `player::ffi`
# (Starfish/ACB) under it. `sim_video` is the one thing here that draws, so `sn_gfx` is a
# dependency of this feature only.
hostsim = ["dep:sn_gfx", "sn_base/hostsim", "sn_machine/hostsim", "sn_platform/hostsim", "sn_gfx/hostsim"]
lab-diagnostics = []
# The `cfg(test)` seams other crates' tests use (`player::preview::reset_for_test`, ...) plus the
# test-mode arms `cfg(test)` alone cannot give a dependent. Enabled from the dependents'
# `[dev-dependencies]`; never in a shipped build.
test-support = ["sn_base/test-support", "sn_machine/test-support", "sn_platform/test-support", "sn_gfx?/test-support", "sn_net/test-support"]

[dependencies]
sn_base = { path = "../base" }
sn_machine = { path = "../machine" }
sn_platform = { path = "../platform" }
sn_gfx = { path = "../gfx", optional = true }
sn_net = { path = "../net" }
libc = "0.2"
# Legacy-encoding text subtitles (GBK, Big5, Shift_JIS, EUC-KR, windows-125x): `player::sub_charset`. Pure Rust, no FFI.
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
# Guesses the encoding of a legacy (non-UTF-8) subtitle track from its bytes, hinted by its language. Pure Rust, on encoding_rs.
chardetng = { version = "1", default-features = false }
# A subtitles addon may serve its file gzipped (`.srt.gz`): `player::sidecar`. Pure Rust (miniz_oxide), no FFI;
# already in the build for `png`.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }

[dev-dependencies]
# Dev-depend on ITSELF with `devtriggers`, so `cargo test -p sn_media` builds the crate and every
# layer below it as the application's suite does.
sn_media = { path = ".", features = ["devtriggers"] }
sn_base = { path = "../base", features = ["test-support"] }
sn_machine = { path = "../machine", features = ["test-support"] }
sn_platform = { path = "../platform", features = ["test-support"] }
sn_net = { path = "../net", features = ["test-support"] }

[lints]
workspace = true
